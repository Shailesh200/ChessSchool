appId: com.chessschool.app
name: Makes a move against a bot
env:
  # Bots need an account. CI passes a test account (repo secrets DEVICE_TEST_EMAIL / DEVICE_TEST_PASSWORD).
  EMAIL: ${EMAIL || ""}
  PASSWORD: ${PASSWORD || ""}
---
- runFlow: common/guest.yaml
# Without a test account: a guest is asked to sign up before playing a bot.
- runFlow:
    when:
      true: ${EMAIL == ""}
    commands:
      - openLink: chessschool://play?bot=cody
      - runFlow: common/open-prompt.yaml
      - assertNotVisible: "Game setup"
- runFlow:
    when:
      true: ${EMAIL != ""}
    commands:
      # Simulator deep links sometimes don't land; open again until the form shows.
      - retry:
          maxRetries: 2
          commands:
            - openLink: chessschool://login
            - runFlow: common/open-prompt.yaml
            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 10000
      - tapOn:
          id: "email-input"
      - inputText: ${EMAIL}
      - tapOn:
          id: "password-input"
      - inputText: ${PASSWORD}
      # iOS may submit on hideKeyboard (the password field's return key is "go"), so the button can be gone.
      - hideKeyboard
      - tapOn:
          text: "Log in"
          optional: true
      # The CI simulator has password AutoFill turned off, so iOS should not offer "Save Password?".
      # If it does, the sheet belongs to a system process that Maestro cannot see, and it hides the app:
      # tap its "Not Now" button by position (centred sheet, left button), only while the tabs are hidden.
      - extendedWaitUntil:
          visible: "Puzzles"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            notVisible: "Puzzles"
          commands:
            - tapOn:
                point: "31%,63%"
      - extendedWaitUntil:
          visible: "Puzzles"
          timeout: 30000
      - retry:
          maxRetries: 2
          commands:
            - openLink: chessschool://play?bot=cody
            - runFlow: common/open-prompt.yaml
            - extendedWaitUntil:
                visible: "Game setup"
                timeout: 15000
      - tapOn: "Start game"
      - extendedWaitUntil:
          visible: "vs Chaukor"
          timeout: 15000
      - tapOn:
          id: "square-e2"
      - tapOn:
          id: "square-e4"
      # The pawn stands on e4 and Cody answers.
      - extendedWaitUntil:
          visible:
            id: "square-e4"
            text: ".*pawn.*"
          timeout: 10000
      - extendedWaitUntil:
          visible: "Your move"
          timeout: 30000
