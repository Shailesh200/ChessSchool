appId: com.chessschool.app
name: Makes a move against a bot
env:
  # Bots need an account. CI passes a test account (repo secrets DEVICE_TEST_EMAIL / DEVICE_TEST_PASSWORD).
  EMAIL: ${EMAIL || ""}
  PASSWORD: ${PASSWORD || ""}
---
- runFlow: common/guest.yaml
# Without a test account: a guest is asked to sign up before playing a bot.
- runFlow:
    when:
      true: ${EMAIL == ""}
    commands:
      - openLink: chessschool://play?bot=cody
      # iOS asks "Open in ChessSchool?" for a custom-scheme link.
      - tapOn:
          text: "Open"
          optional: true
      - assertNotVisible: "Game setup"
- runFlow:
    when:
      true: ${EMAIL != ""}
    commands:
      - openLink: chessschool://login
      # iOS asks "Open in ChessSchool?" for a custom-scheme link.
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          id: "email-input"
      - inputText: ${EMAIL}
      - tapOn:
          id: "password-input"
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn: "Log in"
      - extendedWaitUntil:
          visible: "Puzzles"
          timeout: 30000
      - openLink: chessschool://play?bot=cody
      # iOS asks "Open in ChessSchool?" for a custom-scheme link.
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Game setup"
          timeout: 20000
      - tapOn: "Start game"
      - extendedWaitUntil:
          visible: "vs Chaukor"
          timeout: 15000
      - tapOn:
          id: "square-e2"
      - tapOn:
          id: "square-e4"
      # The pawn stands on e4 and Cody answers.
      - extendedWaitUntil:
          visible:
            id: "square-e4"
            text: ".*pawn.*"
          timeout: 10000
      - extendedWaitUntil:
          visible: "Your move"
          timeout: 30000
