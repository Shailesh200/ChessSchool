appId: com.chessschool.app
name: App Store screenshots
env:
  EMAIL: ${EMAIL || ""}
  PASSWORD: ${PASSWORD || ""}
---
# Not a device test (it lives outside the top-level flows): .github/workflows/store-screenshots.yml runs it on a
# 6.9" iPhone simulator and keeps the PNGs. Shots wait for animations so nothing is mid-transition.
- runFlow: ../common/guest.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-learn

- openLink: chessschool://lesson/board
- runFlow: ../common/open-prompt.yaml
- extendedWaitUntil:
    visible: "This is the board."
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-lesson

- openLink: chessschool://puzzle
- runFlow: ../common/open-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "expected-move"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-puzzle

# Bots, Gym and Looks need an account (the CI test account).
- retry:
    maxRetries: 2
    commands:
      - openLink: chessschool://login
      - runFlow: ../common/open-prompt.yaml
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 10000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Log in"
    optional: true
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible: "Puzzles"
    commands:
      - tapOn:
          point: "31%,63%"
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 30000
- tapOn: "Gym"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-gym

- retry:
    maxRetries: 2
    commands:
      - openLink: chessschool://play?bot=rooky
      - runFlow: ../common/open-prompt.yaml
      - extendedWaitUntil:
          visible: "Game setup"
          timeout: 15000
- tapOn: "Start game"
- extendedWaitUntil:
    visible: "Your move"
    timeout: 20000
- tapOn:
    id: "square-e2"
- tapOn:
    id: "square-e4"
- extendedWaitUntil:
    visible: "Your move"
    timeout: 30000
- tapOn:
    id: "square-g1"
- tapOn:
    id: "square-f3"
- extendedWaitUntil:
    visible: "Your move"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-bot-game

- openLink: chessschool://looks
- runFlow: ../common/open-prompt.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-looks
