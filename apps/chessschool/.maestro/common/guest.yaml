appId: com.chessschool.app
---
# A fresh install opens on the terms, then the first lesson; closing it leads to the welcome steps, Skip lands on Learn.
- launchApp:
    clearState: true
# A slow emulator can still show a system "isn't responding" popup; let it wait.
- tapOn:
    text: "Wait"
    optional: true
# A link prompt left over from an earlier flow (iOS).
- tapOn:
    text: "Cancel"
    optional: true
# Every fresh install agrees to the terms once, first.
- extendedWaitUntil:
    visible: "I.m new, let.s start"
    timeout: 60000
- tapOn: "I.m new, let.s start"
# Both the first lesson ("Step 1 of 9") and the welcome steps ("Step 1 of 3") show this.
- extendedWaitUntil:
    visible: "Step 1 of.*"
    timeout: 60000
- tapOn:
    text: "Close lesson"
    optional: true
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 20000
