appId: com.chessschool.app
---
# A fresh install opens straight into the first lesson; closing it leads to the welcome steps, Skip lands on Learn.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "This is the board."
    timeout: 60000
- tapOn: "Close lesson"
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 20000
