# Device tests for the simulator / emulator build (EXPO_PUBLIC_DEVICE_TEST=1). Run: maestro test apps/chessschool/.maestro
# Texts are the English copy (packages/chessschool-design/src/copy.ts); the test device runs in English.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: false
  # Maestro matches these against each flow's `name`, not its file name.
  flowsOrder:
    - Opens and continues as a guest
    - Finishes the first lesson
    - Solves a puzzle
    - Makes a move against a bot
    - A fatal error shows the Restart screen
