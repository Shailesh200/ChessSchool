appId: com.chessschool.app
name: A fatal error shows the Restart screen
---
# chessschool://crash-test throws while rendering (device-test builds only).
- runFlow: common/guest.yaml
- openLink: chessschool://crash-test
- extendedWaitUntil:
    visible: "ChessSchool needs a restart."
    timeout: 15000
- assertVisible: "Restart"
- tapOn: "Restart"
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 60000
