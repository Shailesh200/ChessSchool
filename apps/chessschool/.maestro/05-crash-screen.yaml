appId: com.chessschool.app
name: A fatal error shows the Restart screen
---
# chessschool://crash-test throws while rendering (device-test builds only).
- runFlow: common/guest.yaml
- openLink: chessschool://crash-test
- runFlow: common/open-prompt.yaml
- extendedWaitUntil:
    visible: "ChessSchool needs a restart."
    timeout: 15000
- assertVisible: "Restart"
- tapOn: "Restart"
# A reload on a slow simulator sometimes stalls; the Restart screen is what this flow proves, so relaunch once if needed.
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 45000
    optional: true
- runFlow:
    when:
      notVisible: "Puzzles"
    commands:
      - launchApp
- extendedWaitUntil:
    visible: "Puzzles"
    timeout: 45000
