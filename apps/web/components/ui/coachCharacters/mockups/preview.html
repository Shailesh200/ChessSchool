<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChessSchool coach character mockups</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      body {
        margin: 0;
        padding: 32px 24px 48px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 28px;
        color: #64748b;
        font-size: 0.95rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
        max-width: 900px;
      }
      figure {
        margin: 0;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        text-align: center;
      }
      figure svg {
        width: 120px;
        height: 120px;
        display: block;
        margin: 0 auto 12px;
      }
      figcaption strong {
        display: block;
        font-size: 1rem;
      }
      figcaption span {
        display: block;
        margin-top: 4px;
        font-size: 0.8rem;
        color: #64748b;
      }
    </style>
  </head>
