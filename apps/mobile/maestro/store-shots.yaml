# Play listing shots of the real Android app (com.chessschool.app).
#
# This is not a web capture. Env vars are documented in
# apps/mobile/store-assets/play-store/SHOTS.md.
# Do not put a real email, password, or production host in this file.
#
# Alex and the credentials come from Luffy's db:seed:test-user (name may change).
# Jimbe's job passes them as STORE_SHOT_EMAIL and STORE_SHOT_PASSWORD.
# Do not print them. Maestro 2.6 does not expand ${...} inside openLink.
# His job substitutes these two names into the login URL before `maestro test`.
#
# Selectors are ids and text that exist on this branch. The campus frame is
# the signed-in greeting, taken before any scroll. The stage heading is not
# used: its display name is "Pre-School" here and "Starter" after the rename
# in PR #31, and that heading sits below the fold.
appId: com.chessschool.app
---
- extendedWaitUntil:
    visible:
      id: "orientation-skip"
    optional: true
    timeout: 120000
- tapOn:
    id: "orientation-skip"
    optional: true
- tapOn:
    text: "Open academy →"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- openLink: "chessschool:///login?email=${STORE_SHOT_EMAIL}&password=${STORE_SHOT_PASSWORD}"
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "academy-title"
    timeout: 120000
- extendedWaitUntil:
    visible:
      text: "Day 4 at the academy"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "academy-subtitle"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Graduate through classes. Become a stronger player."
    timeout: 30000
- openLink: "chessschool:///academy"
- extendedWaitUntil:
    visible:
      id: "tab-Academy"
    timeout: 60000
- takeScreenshot: 01-campus
- openLink: "chessschool:///class/class-pre-board"
- extendedWaitUntil:
    visible:
      id: "class-title"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "The Chess Board"
    timeout: 30000
- takeScreenshot: 02-class-journey
- openLink: "chessschool:///lesson/pawn-power"
- extendedWaitUntil:
    visible:
      id: "lesson-coach"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "Pawns move forward. Push your e-pawn two squares to grab the centre!"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "lesson-turn"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "White to move"
    timeout: 30000
- takeScreenshot: 03-lesson
- openLink: "chessschool:///lesson/fork-master"
- extendedWaitUntil:
    visible:
      id: "lesson-coach"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "lesson-continue"
    timeout: 30000
- tapOn:
    id: "lesson-continue"
- extendedWaitUntil:
    visible:
      text: "Watching…"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      text: "Watching…"
    timeout: 20000
- tapOn:
    id: "lesson-continue"
- extendedWaitUntil:
    visible:
      id: "lesson-turn"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "White to move"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "lesson-hint"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "A knight fork hits two pieces at once — aim at the king and a big piece."
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Your turn — find the royal fork!"
    timeout: 30000
- takeScreenshot: 05-tactic
- openLink: "chessschool:///play"
- extendedWaitUntil:
    visible:
      id: "play-setup-title"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "New match"
    timeout: 30000
- tapOn:
    id: "play-elo-1600"
- extendedWaitUntil:
    visible:
      id: "play-opponent-name"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Vera"
    timeout: 15000
- tapOn:
    id: "play-time-5"
- tapOn:
    id: "play-start-match"
- extendedWaitUntil:
    visible:
      id: "play-game-title"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "vs Vera · 1600"
    timeout: 30000
- tapOn:
    id: "sq-e2"
- tapOn:
    id: "sq-e4"
- extendedWaitUntil:
    visible:
      id: "play-coach-line"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Thinking…"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      text: "Thinking…"
    timeout: 90000
- takeScreenshot: 04-bot-game
- tapOn:
    id: "play-resign"
- tapOn:
    id: "play-resign-confirm"
- extendedWaitUntil:
    visible:
      id: "play-result"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Resigned — Vera wins"
    timeout: 30000
- openLink: "chessschool:///review"
- extendedWaitUntil:
    visible:
      id: "review-latest"
    timeout: 45000
- extendedWaitUntil:
    visible:
      text: "vs Bot · 1600"
    timeout: 15000
- tapOn:
    id: "review-latest"
- extendedWaitUntil:
    visible:
      id: "replay-move-label"
    timeout: 30000
- takeScreenshot: 06-review
