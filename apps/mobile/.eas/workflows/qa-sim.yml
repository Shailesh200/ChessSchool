name: QA simulator

# Manual trigger only. One run per promotion candidate.
on:
  workflow_dispatch:
    inputs:
      git_commit_sha:
        type: string
        required: false
        description: Full 40-character commit SHA to build. Empty uses the commit this run checked out.
      platform:
        type: choice
        required: false
        default: both
        description: Simulator to build for this candidate.
        options:
          - both
          - ios
          - android

run_name: QA sim ${{ inputs.platform || 'both' }}

concurrency:
  group: qa-sim
  cancel_in_progress: false
  queue: single

defaults:
  tools:
    node: "22.23.4"
    pnpm: "10.30.0"
    corepack: true

jobs:
  guard:
    name: Refuse remote databases
    environment: development
    env:
      DATABASE_URL: file:local.db
    steps:
      - name: Fail if Turso or a non-file database is configured
        run: |
          # qa-sim-guard:start
          set -euo pipefail

          turso_names=""
          while IFS= read -r name; do
            if [ -z "${name}" ]; then
              continue
            fi
            if [ -z "${turso_names}" ]; then
              turso_names="${name}"
            else
              turso_names="${turso_names}, ${name}"
            fi
          done < <(env | awk -F= '/^TURSO_/ { print $1 }' | sort)

          if [ -n "${turso_names}" ]; then
            echo "Refusing to run: TURSO_* variables are set (${turso_names})." >&2
            exit 1
          fi

          case "${DATABASE_URL-}" in
            file:*) ;;
            *)
              echo "Refusing to run: DATABASE_URL must start with file:." >&2
              exit 1
              ;;
          esac
          # qa-sim-guard:end

  build_ios:
    name: Build iOS simulator
    needs: [guard]
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' || inputs.platform == '' }}
    type: build
    environment: development
    runs_on: macos-medium
    env:
      DATABASE_URL: file:local.db
    params:
      platform: ios
      profile: qa-sim
      message: qa-sim ios
    hooks:
      before_install_node_modules:
        - name: Pin the promotion commit
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-pin-commit.sh
            sha: ${{ inputs.git_commit_sha }}

  build_android:
    name: Build Android emulator
    needs: [guard]
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' || inputs.platform == '' }}
    type: build
    environment: development
    runs_on: linux-medium
    env:
      DATABASE_URL: file:local.db
    params:
      platform: android
      profile: qa-sim
      message: qa-sim android
    hooks:
      before_install_node_modules:
        - name: Pin the promotion commit
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-pin-commit.sh
            sha: ${{ inputs.git_commit_sha }}

  maestro_ios:
    name: Maestro iOS
    needs: [build_ios]
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' || inputs.platform == '' }}
    type: maestro
    environment: development
    runs_on: macos-medium
    env:
      DATABASE_URL: file:local.db
      SESSION_TOKEN_SECRET: qa-sim-session-token-secret
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: ../../parity/maestro/flows/qa
    hooks:
      after_checkout:
        - name: Pin the built commit
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-pin-commit.sh
            sha: ${{ needs.build_ios.outputs.git_commit_hash }}
        - name: Refuse remote databases
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-guard.sh
      before_maestro_tests:
        - name: Provision the local database and start the web app
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-web.sh
      after_maestro_tests:
        - name: Collect Maestro logs and screenshots
          if: ${{ always() }}
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-collect.sh
        - name: Upload Maestro logs and screenshots
          if: ${{ always() }}
          uses: eas/upload_artifact
          with:
            type: other
            name: qa-sim-ios-maestro
            path: |
              qa-sim-artifacts/**/*
            ignore_error: true

  maestro_android:
    name: Maestro Android
    needs: [build_android]
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' || inputs.platform == '' }}
    type: maestro
    environment: development
    runs_on: linux-medium-nested-virtualization
    env:
      DATABASE_URL: file:local.db
      SESSION_TOKEN_SECRET: qa-sim-session-token-secret
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: ../../parity/maestro/flows/qa
    hooks:
      after_checkout:
        - name: Pin the built commit
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-pin-commit.sh
            sha: ${{ needs.build_android.outputs.git_commit_hash }}
        - name: Refuse remote databases
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-guard.sh
      before_maestro_tests:
        - name: Provision the local database and start the web app
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-web.sh
      after_maestro_tests:
        - name: Collect Maestro logs and screenshots
          if: ${{ always() }}
          uses: ./.eas/functions/qa-sim-run
          with:
            script: qa-sim-collect.sh
        - name: Upload Maestro logs and screenshots
          if: ${{ always() }}
          uses: eas/upload_artifact
          with:
            type: other
            name: qa-sim-android-maestro
            path: |
              qa-sim-artifacts/**/*
            ignore_error: true
