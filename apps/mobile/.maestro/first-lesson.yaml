appId: com.chessschool.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
- tapOn:
    id: orientation-skip
- extendedWaitUntil:
    visible: "Welcome to ChessSchool!"
    timeout: 30000
- runFlow:
    when:
      visible: "Start learning"
    commands:
      - tapOn: "Start learning"
- runFlow:
    when:
      visible: "Start class"
    commands:
      - tapOn: "Start class"
      - extendedWaitUntil:
          visible: "Start journey"
          timeout: 30000
      - tapOn: "Start journey"
- extendedWaitUntil:
    visible: "Close lesson"
    timeout: 30000
