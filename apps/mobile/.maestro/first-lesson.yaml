appId: com.chessschool.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
- tapOn:
    id: orientation-skip
- extendedWaitUntil:
    visible: "Chess Basics"
    timeout: 30000
- tapOn: "The Chess Board, .*"
- extendedWaitUntil:
    visible:
      id: class-detail
    timeout: 30000
- tapOn: "1 · .*"
- extendedWaitUntil:
    visible: "Close lesson"
    timeout: 45000
