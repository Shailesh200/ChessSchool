appId: com.chessschool.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
- tapOn:
    id: orientation-skip
- extendedWaitUntil:
    visible: "Chess Basics"
    timeout: 20000
- tapOn: "Play"
- extendedWaitUntil:
    visible: "New match"
    timeout: 20000
- tapOn: "Review"
- extendedWaitUntil:
    visible: "Nothing is due right now."
    timeout: 20000
- tapOn: "Profile"
- assertVisible: "Guest learner"
- tapOn: "Learn"
- assertVisible: "Chess Basics"
