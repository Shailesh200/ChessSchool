appId: com.chessschool.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
- tapOn:
    id: orientation-skip
- extendedWaitUntil:
    visible: "Welcome to ChessSchool!"
    timeout: 20000
- tapOn: "Play"
- assertVisible: "New match"
- tapOn: "Review"
- assertVisible: "No games yet"
- tapOn: "Profile"
- assertVisible: "Guest learner"
- tapOn: "Learn"
- assertVisible: "Welcome to ChessSchool!"
