appId: com.chessschool.app
---
- launchApp:
    clearState: true
- runFlow: enter-guest.yaml
- extendedWaitUntil:
    visible: "Chess Basics"
    timeout: 20000
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Quick game"
    timeout: 20000
- tapOn: "Review"
- extendedWaitUntil:
    visible: "Nothing is due right now."
    timeout: 20000
- tapOn: "Profile"
- assertVisible: "Guest learner"
- tapOn: "Learn"
- assertVisible: "Chess Basics"
