appId: com.chessschool.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
- tapOn:
    id: orientation-skip
- extendedWaitUntil:
    visible: "Welcome to ChessSchool!"
    timeout: 20000
- assertVisible: "Enroll in the academy to track your progress."
- assertVisible: "Learn"
