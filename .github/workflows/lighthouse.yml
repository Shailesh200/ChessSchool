name: Lighthouse

# Separate from main CI so Perf/CWV lab audits don't block typecheck/e2e.
# Still runs on PRs to main; uploads HTML scorecard artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Web Lighthouse / CWV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      SESSION_TOKEN_SECRET: e2e-test-session-token-secret
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Resolve Chromium path for Lighthouse
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' 2>/dev/null | head -1)"
          if [ -z "$CHROME" ]; then
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome 2>/dev/null | head -1)"
          fi
          if [ -z "$CHROME" ] || [ ! -x "$CHROME" ]; then
            echo "✗ Playwright Chromium binary not found for Lighthouse"
            find "$HOME/.cache/ms-playwright" -type f -name 'chrome*' 2>/dev/null | head -20
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using CHROME_PATH=$CHROME"

      - name: Fresh local DB
        run: pnpm --filter web db:fresh

      - name: Build
        run: pnpm --filter web build

      - name: Web Lighthouse / CWV
        run: bash scripts/verify-web-lighthouse.sh
        env:
          SKIP_LIGHTHOUSE: "0"
          # GHA lab is noisy: hard-gate A11y/BP/SEO; Perf/CWV reported as warnings.
          WEB_LH_CI_RELAXED: "1"
          WEB_LH_LAB_SLACK_MS: "1200"
          WEB_LH_RETRIES: "2"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/lighthouse/
          retention-days: 14
          if-no-files-found: ignore
