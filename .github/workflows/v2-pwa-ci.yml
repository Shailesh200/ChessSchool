name: v2 PWA CI

# Typecheck, unit tests and commit identity for the v2 app.
# Does not replace the main-branch CI workflow.

on:
  push:
    branches:
      - "feat/v2-*"
  pull_request:
    paths:
      - "apps/chessschool/**"
      - "apps/chessschool-web/**"
      - "apps/chessschool-api/**"
      - "packages/chessschool-chess/**"
      - "packages/chessschool-design/**"
      - ".github/workflows/v2-pwa-ci.yml"
      - ".github/workflows/v2-identity-guard.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

concurrency:
  group: v2-pwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @chessschool/design --filter @chessschool/chess --filter chessschool-api --filter chessschool-web --filter chessschool typecheck

      # chessschool and chessschool-web have no unit-test script.
      - name: Test
        run: pnpm --filter @chessschool/design --filter @chessschool/chess --filter chessschool-api test

  identity-guard:
    name: identity guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check author, committer and message
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: 610968701e8a555823381a7d6459ac2685cd0220
        run: bash .github/workflows/v2-identity-guard.sh

  e2e:
    name: web e2e (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    env:
      CHESSSCHOOL_API_URL: https://api.chess-school.in
      BASE_URL: http://127.0.0.1:3100

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Build chessschool-web
        run: pnpm --filter chessschool-web build

      - name: Start Next.js
        working-directory: apps/chessschool-web
        run: |
          pnpm exec next start --hostname 127.0.0.1 --port 3100 > /tmp/next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL"; then
              exit 0
            fi
            sleep 2
          done
          echo "next start did not listen on :3100" >&2
          cat /tmp/next-start.log >&2
          exit 1

      - name: Phase 1–3 walkthrough
        working-directory: apps/chessschool-web
        run: node e2e/phase1-3.mjs /tmp/cs-phase
