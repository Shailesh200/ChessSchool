name: Android e2e

# Local debug APK on an ubuntu-latest emulator. No EAS, no store upload,
# no production API. A skipped emulator job must not fail the guard job.

on:
  workflow_dispatch:
  push:
    branches:
      - rc/nov2

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Maestro on API 34
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      APP_VARIANT: test
      EXPO_PUBLIC_API_URL: https://chess-school-test.vercel.app
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.30.0 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Expo prebuild Android
        working-directory: apps/mobile
        shell: bash
        run: npx expo prebuild -p android --no-install

      - name: Embed the JS bundle in the debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle="apps/mobile/android/app/build.gradle"
          python3 - "$gradle" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          needle = "react {"
          assignment = 'debuggableVariants = ["never"]'
          if needle not in text:
              raise SystemExit("react block missing from " + str(path))
          # Prebuild mentions debuggableVariants in a comment, so a name grep
          # skips the patch and the debug variant still omits the JS bundle.
          if assignment not in text:
              text = text.replace(needle, "react {\n    " + assignment + "\n", 1)
              path.write_text(text)
          PY
          grep -n 'debuggableVariants' "$gradle"
          grep -q '^[[:space:]]*debuggableVariants = \["never"\]' "$gradle"

      - name: Emulator, debug APK, Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          # android-emulator-runner runs each line in its own `sh -c`, so this stays one line.
          script: >-
            status=0;
            cd apps/mobile/android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon || status=$?;
            if [ "$status" -eq 0 ]; then unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'index.android.bundle' || { echo 'JS bundle missing from debug APK'; status=1; }; fi;
            if [ "$status" -eq 0 ]; then cd "$GITHUB_WORKSPACE" && adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk || status=$?; fi;
            if [ "$status" -eq 0 ]; then maestro test apps/mobile/.maestro || status=$?; fi;
            mkdir -p "$GITHUB_WORKSPACE/android-e2e-artifacts";
            adb logcat -d > "$GITHUB_WORKSPACE/android-e2e-artifacts/logcat.txt" || true;
            if [ -d "$HOME/.maestro/tests" ]; then cp -a "$HOME/.maestro/tests" "$GITHUB_WORKSPACE/android-e2e-artifacts/maestro" || true; fi;
            exit "$status"

      - name: Upload screenshots and logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-failure
          path: android-e2e-artifacts/
          if-no-files-found: warn

  guard:
    name: skipped job does not fail the guard
    needs: android-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Accept success or skipped
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.android-e2e.result }}"
          echo "android-e2e result: ${result}"
          case "$result" in
            success|skipped) exit 0 ;;
            *)
              echo "android-e2e ${result}" >&2
              exit 1
              ;;
          esac
