name: CI

# Required gate for PRs into main — mirrors local `pnpm verify:milestone`
# (typecheck, lint, format, coverage, build, SEO, e2e incl. parity semantic,
# Lighthouse/CWV) plus puzzle-school validate and parity Maestro coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:milestone
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      SESSION_TOKEN_SECRET: e2e-test-session-token-secret

    steps:
      - uses: actions/checkout@v4

      # Pin exact pnpm; avoid action-setup cache bugs with bare version: 10
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Puzzle-school validate
        run: pnpm puzzle-school:validate

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Resolve Chromium path for Lighthouse
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' 2>/dev/null | head -1)"
          if [ -z "$CHROME" ]; then
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome 2>/dev/null | head -1)"
          fi
          if [ -z "$CHROME" ] || [ ! -x "$CHROME" ]; then
            echo "✗ Playwright Chromium binary not found for Lighthouse"
            find "$HOME/.cache/ms-playwright" -type f -name 'chrome*' 2>/dev/null | head -20
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using CHROME_PATH=$CHROME"

      - name: Full milestone verification (SEO, e2e, Lighthouse/CWV, parity coverage)
        run: pnpm verify:milestone
        env:
          CI: true
          SESSION_TOKEN_SECRET: e2e-test-session-token-secret
          SKIP_LIGHTHOUSE: "0"
