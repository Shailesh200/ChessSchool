name: CI

# Required gate for PRs into main — mirrors local `pnpm verify:milestone`
# (typecheck, lint, format, coverage, build, SEO, e2e incl. parity semantic,
# Lighthouse/CWV) plus puzzle-school validate and parity Maestro coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:milestone
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      SESSION_TOKEN_SECRET: e2e-test-session-token-secret
      # Next + vitest coverage can spike RSS on the runner.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      # Pin exact pnpm; avoid action-setup cache bugs with bare version: 10
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Puzzle-school validate
        run: pnpm puzzle-school:validate

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Resolve Chromium path for Lighthouse
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' 2>/dev/null | head -1)"
          if [ -z "$CHROME" ]; then
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome 2>/dev/null | head -1)"
          fi
          if [ -z "$CHROME" ] || [ ! -x "$CHROME" ]; then
            echo "✗ Playwright Chromium binary not found for Lighthouse"
            find "$HOME/.cache/ms-playwright" -type f -name 'chrome*' 2>/dev/null | head -20
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using CHROME_PATH=$CHROME"

      # Discrete steps = same gates as scripts/verify-milestone.sh, clearer CI logs.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm --filter web format:check

      - name: Test coverage (≥90%)
        run: bash scripts/verify-test-coverage.sh

      # Required before `next build` — static pages/API routes read the curriculum DB.
      - name: Fresh local DB
        run: pnpm --filter web db:fresh

      - name: Build
        run: pnpm build

      - name: Home JS budget
        run: node scripts/verify-home-js-budget.mjs

      - name: E2E route manifest coverage
        run: node scripts/verify-e2e-route-coverage.mjs

      - name: Web SEO baseline
        run: bash scripts/verify-web-seo.sh

      - name: Parity Maestro coverage
        run: |
          node scripts/generate-parity-maestro.mjs
          node scripts/verify-parity-coverage.mjs

      - name: Playwright e2e (incl. parity semantic)
        run: pnpm e2e

      - name: Web Lighthouse / CWV
        run: bash scripts/verify-web-lighthouse.sh
        env:
          SKIP_LIGHTHOUSE: "0"
          # Lab variance on GHA runners — LCP/FCP slack; TBT/MPFID are warn-only unless STRICT.
          WEB_LH_LAB_SLACK_MS: "800"
          WEB_LH_RETRIES: "3"
