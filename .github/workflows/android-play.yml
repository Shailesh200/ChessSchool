name: Android Play draft

# Runs by hand (Actions tab, once this file is on main) or when the `play` branch is
# pushed: `git push -f origin <commit>:play`. Builds the Android app bundle on GitHub's
# Linux runner with `eas build --local` (no Expo build credits) and uploads it to Play
# Console as a DRAFT on the internal track (eas.json submit profile). Nothing rolls out
# to testers until someone starts the rollout in Play Console. Bump
# `android.versionCode` in apps/chessschool/app.json before each run; Play refuses a
# code it has seen.
#
# Repo secrets: EXPO_TOKEN, SENTRY_AUTH_TOKEN. The upload keystore and the Play
# service account key are read from EAS with EXPO_TOKEN.
# The .aab is not uploaded as an artifact: this repo is public.

on:
  workflow_dispatch:
  push:
    branches: [play]

permissions:
  contents: read

concurrency:
  group: android-play
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g eas-cli@27.10.0

      # pnpm hides Expo's own dependencies from config plugins that eas-cli loads directly.
      - name: Let eas-cli resolve Expo's dependencies
        run: echo "NODE_PATH=$(dirname "$(realpath apps/chessschool/node_modules/expo)"):$PWD/node_modules/.pnpm/node_modules" >> "$GITHUB_ENV"

      # The runner's Gradle settings override the generated project's: the default 512 MB
      # metaspace runs out and the build hangs. Phones only need the two ARM builds.
      - name: Give Gradle enough memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          PROPS

      - name: Build the Android app bundle
        working-directory: apps/chessschool
        run: eas build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/ChessSchool.aab"

      - name: Upload to Play Console as a draft
        working-directory: apps/chessschool
        run: eas submit --platform android --profile production --path "$RUNNER_TEMP/ChessSchool.aab" --non-interactive --wait

      - name: Remove the build
        if: always()
        run: rm -f "$RUNNER_TEMP/ChessSchool.aab"
