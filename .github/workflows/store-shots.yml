name: Store shots

# Manual Play screenshots of the real Android app.
# workflow_dispatch only. This file has no push or pull_request trigger.
# No EAS, no Play signing keys, no production or Vercel host.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: store-shots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Android store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: file:local.db
      STORE_SHOT_API_URL: http://10.0.2.2:3000
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
      EXPO_PUBLIC_PARITY: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXPO_NO_TELEMETRY: "1"
      SESSION_TOKEN_SECRET: store-shot-runner-session-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse anything but the emulator loopback
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { assertSafeCaptureHost } from "./apps/mobile/store-assets/play-store/capture-host.mjs";
          const url = process.env.STORE_SHOT_API_URL ?? "";
          assertSafeCaptureHost(url);
          const host = new URL(url).hostname;
          if (host !== "10.0.2.2") {
            throw new Error("Store shots only capture against the emulator loopback 10.0.2.2");
          }
          if (/vercel\.app$/i.test(host) || host === "chess-school.in" || host === "www.chess-school.in") {
            throw new Error("Refusing a production, staging, or Vercel host");
          }
          process.stdout.write("Host guard passed for 10.0.2.2\n");
          JS

      - name: Create the made-up Alex credentials
        run: |
          set -euo pipefail
          umask 077
          email="alex.${GITHUB_RUN_ID}@example.com"
          password="$(openssl rand -hex 16)"
          if [ "${#password}" -lt 8 ]; then
            echo "Could not generate a store-shot password" >&2
            exit 1
          fi
          printf '%s' "$email" > "$RUNNER_TEMP/store-shot-email"
          printf '%s' "$password" > "$RUNNER_TEMP/store-shot-password"
          echo "::add-mask::$email"
          echo "::add-mask::$password"

      - name: Seed a throwaway local database
        run: |
          set -euo pipefail
          unset DATABASE_AUTH_TOKEN
          export DATABASE_URL=file:local.db
          export STORE_SHOT_API_URL=http://10.0.2.2:3000
          STORE_SHOT_EMAIL="$(cat "$RUNNER_TEMP/store-shot-email")"
          STORE_SHOT_PASSWORD="$(cat "$RUNNER_TEMP/store-shot-password")"
          export STORE_SHOT_EMAIL
          export STORE_SHOT_PASSWORD
          echo "::add-mask::$STORE_SHOT_EMAIL"
          echo "::add-mask::$STORE_SHOT_PASSWORD"
          pnpm --filter web db:fresh
          pnpm --filter web db:seed-store-shot

      - name: Build the local API
        working-directory: apps/web
        run: |
          set -euo pipefail
          unset DATABASE_AUTH_TOKEN
          export DATABASE_URL=file:local.db
          pnpm exec next build

      - name: Build a release APK on the runner
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          export EXPO_PUBLIC_API_URL=http://10.0.2.2:3000
          export EXPO_PUBLIC_PARITY=1
          export SENTRY_DISABLE_AUTO_UPLOAD=true
          pnpm exec expo prebuild --platform android --clean --no-install
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "usesCleartextTraffic" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              path.write_text(text)
          PY
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --no-configure-on-demand -Dorg.gradle.configureondemand=false --console=plain

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -euo pipefail
            unset DATABASE_AUTH_TOKEN
            export DATABASE_URL=file:local.db
            cd "$GITHUB_WORKSPACE/apps/web"
            pnpm exec next start --port 3000 > "$RUNNER_TEMP/store-shot-api.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/store-shot-api.pid"
            ready=0
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
              if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Local API did not start" >&2
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
            apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
            if [ -z "$apk" ]; then
              echo "Release APK was not produced" >&2
              exit 1
            fi
            adb install -r "$apk"
            email="$(cat "$RUNNER_TEMP/store-shot-email")"
            password="$(cat "$RUNNER_TEMP/store-shot-password")"
            echo "::add-mask::$email"
            echo "::add-mask::$password"
            link="$(STORE_SHOT_EMAIL="$email" STORE_SHOT_PASSWORD="$password" python3 - <<'PY'
            import os, urllib.parse
            email = urllib.parse.quote(os.environ["STORE_SHOT_EMAIL"], safe="")
            password = urllib.parse.quote(os.environ["STORE_SHOT_PASSWORD"], safe="")
            print(f"chessschool:///login?email={email}&password={password}", end="")
            PY
            )"
            echo "::add-mask::$link"
            mkdir -p "$GITHUB_WORKSPACE/store-shot-screenshots"
            set +e
            maestro test -e "LOGIN_LINK=$link" "$GITHUB_WORKSPACE/apps/mobile/maestro/store-shots.yaml"
            status=$?
            set -e
            if [ -d "$HOME/.maestro" ]; then
              find "$HOME/.maestro" -name '*.png' -exec cp {} "$GITHUB_WORKSPACE/store-shot-screenshots/" \;
            fi
            find "$GITHUB_WORKSPACE" \
              -path "$GITHUB_WORKSPACE/store-shot-screenshots" -prune -o \
              \( -name '01-campus.png' -o -name '02-class-journey.png' -o -name '03-lesson.png' -o -name '04-bot-game.png' -o -name '05-tactic.png' -o -name '06-review.png' \) \
              -exec cp {} "$GITHUB_WORKSPACE/store-shot-screenshots/" \;
            exit "$status"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-store-screenshots
          path: store-shot-screenshots/*.png
          if-no-files-found: warn
