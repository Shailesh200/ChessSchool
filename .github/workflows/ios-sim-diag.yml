name: iOS simulator boot check

# Temporary: builds the release app for the simulator, launches it and prints any crash.
on:
  push:
    branches: [diag-ios]

permissions:
  contents: read

jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.30.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g eas-cli@27.10.0
      - run: echo "NODE_PATH=$(dirname "$(realpath apps/chessschool/node_modules/expo)"):$PWD/node_modules/.pnpm/node_modules" >> "$GITHUB_ENV"
      - name: Add a simulator profile
        working-directory: apps/chessschool
        run: node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("eas.json","utf8"));j.build.sim={extends:"production",distribution:"internal",ios:{simulator:true}};fs.writeFileSync("eas.json",JSON.stringify(j,null,2));'
      - name: Build for the simulator
        working-directory: apps/chessschool
        run: eas build --platform ios --profile sim --local --non-interactive --output "$RUNNER_TEMP/app.tar.gz"
      - name: Launch and collect the crash
        run: |
          mkdir -p "$RUNNER_TEMP/app" && tar -xzf "$RUNNER_TEMP/app.tar.gz" -C "$RUNNER_TEMP/app"
          APP=$(find "$RUNNER_TEMP/app" -name '*.app' -maxdepth 3 | head -1); echo "app: $APP"
          UDID=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;const ks=Object.keys(d).filter(k=>/iOS-26/.test(k)).sort().reverse();for(const k of ks)for(const x of d[k])if(x.name.startsWith("iPhone")){console.error("runtime",k,x.name);console.log(x.udid);process.exit()}process.exit(1)')
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          for L in "en_IN en-IN" "hi_IN hi"; do
            set -- $L
            xcrun simctl terminate "$UDID" com.chessschool.app 2>/dev/null || true
            xcrun simctl spawn "$UDID" defaults write -g AppleLocale "$1"
            xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "$2"
            xcrun simctl shutdown "$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b >/dev/null
            : > "$RUNNER_TEMP/log.txt"
            xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "ChessSchool"' > "$RUNNER_TEMP/log.txt" 2>&1 &
            LP=$!
            SIMCTL_CHILD_TZ=Asia/Kolkata xcrun simctl launch "$UDID" com.chessschool.app || true
            sleep 30
            echo "== $1: running? =="; xcrun simctl spawn "$UDID" launchctl list | grep -i chessschool || echo "NOT RUNNING"
            echo "== $1: log =="; grep -iE 'ReactNativeJS|javascript|exception|fatal|unhandled|TypeError|ReferenceError|RangeError|SyntaxError|ErrorRecovery|launchFailed' "$RUNNER_TEMP/log.txt" | grep -vE 'CFBundle|registering method|protocol_copyPropertyList' | head -40
            kill $LP || true
          done
          echo "== crash reports =="; for f in ~/Library/Logs/DiagnosticReports/ChessSchool*; do [ -f "$f" ] && head -c 15000 "$f"; done; true
