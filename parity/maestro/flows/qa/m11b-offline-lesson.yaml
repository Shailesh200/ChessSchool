appId: com.chessschool.app
name: "M-10/M-11 offline: complete a lesson with network OFF, kill + relaunch offline, state kept"
tags:
  - M-10
  - M-11
---
# Part B runs while the runner has airplane mode ON (verified by a failed ping to 10.0.2.2 first).
- openLink: "chessschool:///lesson/pre-square-d5"
- extendedWaitUntil:
    visible: "Where is the square d5?"
    timeout: 90000
- tapOn: "File d, rank 5.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "XP earned"
    timeout: 90000
- assertVisible: "\\+10"
# M-11: kill app while offline, relaunch offline
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-Academy"
    timeout: 90000
- tapOn:
    id: "tab-Profile"
- extendedWaitUntil:
    visible: "Day streak"
    timeout: 60000
