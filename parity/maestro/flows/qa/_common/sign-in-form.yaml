# Sign in through the real login form. Env: SI_EMAIL, SI_PASSWORD (passed by runFlow env:; the callers read the passwords from the shell as MAESTRO_*_PASSWORD).
# Ends on the Academy with the "Daily goal" card visible. If onboarding appears after the login, it is finished in the UI first.
appId: com.chessschool.app
---
- openLink: "chessschool:///login"
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${SI_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${SI_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    notVisible:
      id: "login-submit"
    timeout: 60000
- extendedWaitUntil:
    visible: "Let's tailor your studies.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Let's tailor your studies.*"
    file: finish-onboarding.yaml
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Daily goal"
    timeout: 60000
